<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 FIFA World Cup｜完整賽程行事曆</title>
  <meta name="description" content="2026世界盃足球賽完整賽程行事曆，含小組賽、32強、16強、8強、4強、季軍賽、決賽（台灣時間）" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #f5c842;
      --green: #00c86f;
      --bg-dark: #0a0e1a;
      --bg-card: #111827;
      --bg-card2: #1a2235;
      --border: rgba(255,255,255,0.08);
      --text-primary: #f0f4ff;
      --text-secondary: #8b9bb4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% -10%, rgba(0,200,111,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 110%, rgba(245,200,66,0.10) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }

    .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

    /* ── Hero ── */
    .hero { text-align: center; padding: 60px 24px 48px; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(245,200,66,0.15); border: 1px solid rgba(245,200,66,0.4);
      border-radius: 999px; padding: 6px 18px;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em;
      color: var(--gold); text-transform: uppercase; margin-bottom: 20px;
    }
    .hero h1 {
      font-size: clamp(2rem, 5vw, 3.6rem); font-weight: 900; line-height: 1.1;
      background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, var(--green) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      margin-bottom: 12px;
    }
    .hero-sub { font-size: 1rem; color: var(--text-secondary); margin-bottom: 32px; }
    .hero-stats { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat-num { font-size: 2rem; font-weight: 800; color: var(--gold); line-height: 1; }
    .stat-label { font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

    /* ── Filters ── */
    .filter-section {
      padding: 12px 0 20px; position: sticky; top: 0; z-index: 100;
      background: linear-gradient(to bottom, var(--bg-dark) 90%, transparent);
    }

    /* Desktop: always expanded */
    .filter-desktop { display: block; }
    .filter-toggle-btn { display: none; }

    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center; margin-bottom: 8px; }
    .filter-label { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.08em; width: 100%; text-align: center; margin-bottom: 4px; }
    .filter-btn {
      padding: 7px 16px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text-secondary);
      font-family: inherit; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .filter-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text-primary); }
    .filter-btn.active { background: var(--gold); border-color: var(--gold); color: #0a0e1a; font-weight: 700; }
    .filter-btn.stage-btn.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }

    /* Mobile collapsed state */
    @media (max-width: 768px) {
      .filter-desktop {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.35s ease, opacity 0.25s ease;
        opacity: 0;
      }
      .filter-desktop.open {
        max-height: 400px;
        opacity: 1;
      }
      .filter-toggle-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 10px 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .filter-toggle-btn:hover { border-color: rgba(255,255,255,0.2); }
      .filter-toggle-btn .toggle-label { display: flex; align-items: center; gap: 8px; }
      .filter-toggle-btn .toggle-arrow {
        font-size: 0.7rem;
        transition: transform 0.3s;
        color: var(--text-secondary);
      }
      .filter-toggle-btn.open .toggle-arrow { transform: rotate(180deg); }
      .filter-toggle-btn .active-tag {
        background: #7c3aed; color: #fff;
        padding: 2px 10px; border-radius: 999px;
        font-size: 0.72rem; font-weight: 700;
      }
      .filter-toggle-btn .active-tag.gold { background: var(--gold); color: #0a0e1a; }
    }

    /* ── Phase Divider ── */
    .phase-divider {
      display: flex; align-items: center; gap: 16px;
      margin: 16px 0 0;
    }
    .phase-divider-line { flex: 1; height: 1px; background: var(--border); }
    .phase-title {
      font-size: 0.8rem; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; padding: 6px 18px;
      border-radius: 999px; white-space: nowrap;
    }
    .phase-group { background: rgba(245,200,66,0.15); color: var(--gold); border: 1px solid rgba(245,200,66,0.3); }
    .phase-r32 { background: rgba(124,58,237,0.15); color: #a78bfa; border: 1px solid rgba(124,58,237,0.3); }
    .phase-r16 { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
    .phase-qf  { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .phase-sf  { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .phase-3rd { background: rgba(156,163,175,0.15); color: #d1d5db; border: 1px solid rgba(156,163,175,0.3); }
    .phase-final { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

    /* ── Calendar ── */
    .calendar { display: flex; flex-direction: column; gap: 20px; padding-bottom: 80px; }

    /* ── Day Card ── */
    .day-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      opacity: 0; transform: translateY(20px); animation: fadeUp 0.4s forwards;
    }
    .day-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

    /* Knockout card accent */
    .day-card.knockout { border-color: rgba(124,58,237,0.25); }
    .day-card.knockout .day-date-block { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
    .day-card.final-card { border-color: rgba(239,68,68,0.4); }
    .day-card.final-card .day-date-block { background: linear-gradient(135deg, #ef4444, #f59e0b); }
    .day-card.third-card { border-color: rgba(156,163,175,0.3); }
    .day-card.third-card .day-date-block { background: linear-gradient(135deg, #6b7280, #9ca3af); }

    .day-header {
      display: flex; align-items: center; gap: 16px; padding: 18px 24px;
      background: linear-gradient(90deg, var(--bg-card2) 0%, rgba(255,255,255,0.02) 100%);
      border-bottom: 1px solid var(--border);
    }
    .day-date-block {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-width: 56px; height: 56px; background: var(--gold);
      border-radius: 14px; color: #0a0e1a; font-weight: 900;
    }
    .day-date-block .day-num { font-size: 1.5rem; line-height: 1; }
    .day-date-block .day-mon { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.05em; }
    .day-info { flex: 1; }
    .day-weekday { font-size: 1.05rem; font-weight: 700; }
    .day-match-count { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }
    .day-groups { display: flex; gap: 6px; flex-wrap: wrap; }
    .group-pill { padding: 3px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; }

    /* ── Match Row ── */
    .matches { display: flex; flex-direction: column; }
    .match-row {
      display: grid; grid-template-columns: 90px 1fr auto 1fr 120px;
      align-items: center; gap: 12px; padding: 14px 24px;
      border-bottom: 1px solid var(--border); transition: background 0.15s;
    }
    .match-row:last-child { border-bottom: none; }
    .match-row:hover { background: rgba(255,255,255,0.03); }

    /* Knockout match row */
    .match-row.ko-row { grid-template-columns: 90px 1fr auto 1fr 120px; }

    .match-time { font-size: 1.1rem; font-weight: 700; color: var(--gold); text-align: center; font-variant-numeric: tabular-nums; }
    .match-time-sub { font-size: 0.65rem; color: var(--text-secondary); text-align: center; margin-top: 2px; }
    .match-num { font-size: 0.6rem; font-weight: 700; color: #7c3aed; text-align: center; margin-top: 3px; letter-spacing: 0.05em; background: rgba(124,58,237,0.12); border-radius: 4px; padding: 1px 4px; }

    .team { display: flex; align-items: center; gap: 10px; }
    .team.away { flex-direction: row-reverse; }
    .team.away .team-name { text-align: right; }
    .team.away .team-name-en { text-align: right; }
    .team-flag { font-size: 1.8rem; line-height: 1; flex-shrink: 0; }
    .team-name { font-size: 0.92rem; font-weight: 600; color: var(--text-primary); }
    .team-name-en { font-size: 0.68rem; color: var(--text-secondary); margin-top: 1px; }

    /* Knockout TBD team */
    .team-tbd { font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); line-height: 1.4; }
    .team-tbd strong { color: #a78bfa; font-size: 0.75rem; display: block; }

    .vs-block { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .vs-text { font-size: 0.72rem; font-weight: 800; color: var(--text-secondary); letter-spacing: 0.1em; }
    .group-badge { padding: 2px 8px; border-radius: 999px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em; }
    .ko-badge { padding: 2px 10px; border-radius: 999px; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.06em; background: rgba(124,58,237,0.2); color: #a78bfa; border: 1px solid rgba(124,58,237,0.35); }
    .ko-badge.final-badge { background: rgba(239,68,68,0.2); color: #fca5a5; border-color: rgba(239,68,68,0.4); }
    .ko-badge.sf-badge { background: rgba(245,158,11,0.2); color: #fbbf24; border-color: rgba(245,158,11,0.4); }
    .ko-badge.qf-badge { background: rgba(16,185,129,0.2); color: #34d399; border-color: rgba(16,185,129,0.4); }
    .ko-badge.r16-badge { background: rgba(59,130,246,0.2); color: #60a5fa; border-color: rgba(59,130,246,0.4); }
    .ko-badge.third-badge { background: rgba(156,163,175,0.2); color: #d1d5db; border-color: rgba(156,163,175,0.4); }

    .match-venue { font-size: 0.65rem; color: var(--text-secondary); text-align: right; line-height: 1.5; }
    .match-venue .venue-country { font-size: 0.6rem; opacity: 0.7; }

    /* ── Group Colors ── */
    .group-A { background: rgba(231,76,60,0.15); color: #e74c3c; border: 1px solid rgba(231,76,60,0.3); }
    .group-B { background: rgba(230,126,34,0.15); color: #e67e22; border: 1px solid rgba(230,126,34,0.3); }
    .group-C { background: rgba(241,196,15,0.15); color: #f1c40f; border: 1px solid rgba(241,196,15,0.3); }
    .group-D { background: rgba(46,204,113,0.15); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
    .group-E { background: rgba(26,188,156,0.15); color: #1abc9c; border: 1px solid rgba(26,188,156,0.3); }
    .group-F { background: rgba(52,152,219,0.15); color: #3498db; border: 1px solid rgba(52,152,219,0.3); }
    .group-G { background: rgba(155,89,182,0.15); color: #9b59b6; border: 1px solid rgba(155,89,182,0.3); }
    .group-H { background: rgba(233,30,99,0.15); color: #e91e63; border: 1px solid rgba(233,30,99,0.3); }
    .group-I { background: rgba(255,87,34,0.15); color: #ff5722; border: 1px solid rgba(255,87,34,0.3); }
    .group-J { background: rgba(96,125,139,0.15); color: #90a4ae; border: 1px solid rgba(96,125,139,0.3); }
    .group-K { background: rgba(121,85,72,0.15); color: #a1887f; border: 1px solid rgba(121,85,72,0.3); }
    .group-L { background: rgba(0,188,212,0.15); color: #00bcd4; border: 1px solid rgba(0,188,212,0.3); }

    /* ── Scores ── */
    .match-score { display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
    .score-num { font-size: 1.2rem; font-weight: 900; font-variant-numeric: tabular-nums; min-width: 18px; text-align: center; }
    .score-dash { font-size: 0.9rem; color: var(--text-secondary); font-weight: 700; }
    .score-win { color: var(--green); }
    .score-lose { color: var(--text-secondary); opacity: 0.8; }
    .score-draw { color: var(--gold); }

    /* ── Standings Table ── */
    .standings-wrapper { margin-bottom: 30px; animation: fadeUp 0.4s forwards; }
    .standings-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); font-size: 0.85rem; }
    .standings-table th, .standings-table td { padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--border); }
    .standings-table th { background: rgba(255,255,255,0.03); color: var(--text-secondary); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.05em; }
    .standings-table tr:last-child td { border-bottom: none; }
    .standings-table td.team-cell { text-align: left; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .standings-table td.pts-cell { font-weight: 800; color: var(--gold); font-size: 0.95rem; }
    .standings-table tr.q-row td { background: rgba(0,200,111,0.05); }
    .standings-table tr.q3-row td { background: rgba(245,200,66,0.05); }
    .standings-header { padding: 6px 14px; font-weight: 800; font-size: 0.9rem; border-left: 3px solid var(--gold); background: rgba(255,255,255,0.03); margin-bottom: 12px; display: inline-block; border-radius: 0 6px 6px 0; }

    /* ── Legend ── */
    .legend {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px 24px; margin-bottom: 20px;
    }
    .legend-title { font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px; }
    /* 12 columns on wide screens, fewer on small */
    .legend-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }
    @media (max-width: 900px) { .legend-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 600px) { .legend-grid { grid-template-columns: repeat(3, 1fr); } }
    .legend-group {
      background: var(--bg-card2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px;
    }
    .legend-group-label {
      font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em;
      margin-bottom: 8px; text-transform: uppercase;
    }
    .legend-team {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.72rem; color: var(--text-secondary); line-height: 1.8;
    }
    .legend-team img.emoji { width: 16px; height: 16px; vertical-align: middle; }
    .legend-team span.flag-emoji { font-size: 0.9rem; line-height: 1; }

    /* ── Emoji image sizing (Twemoji) ── */
    /* Team flags in match rows */
    .team-flag img.emoji { width: 2rem; height: 2rem; vertical-align: middle; }
    /* Small emoji in buttons / labels */
    .filter-btn img.emoji, .hero-badge img.emoji, .phase-title img.emoji { width: 1em; height: 1em; vertical-align: -0.15em; }
    /* Mobile toggle button emoji */
    .filter-toggle-btn img.emoji { width: 1.2em; height: 1.2em; vertical-align: -0.15em; }
    /* Venue flag prefix */
    .match-venue img.emoji { width: 0.9em; height: 0.9em; vertical-align: middle; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .match-row { grid-template-columns: 70px 1fr auto 1fr; gap: 8px; padding: 12px 16px; }
      .ko-row { grid-template-columns: 70px 1fr auto 1fr; }
      .match-venue { display: none; }
      .team-name { font-size: 0.82rem; }
      .team-flag { font-size: 1.5rem; }
      .day-header { padding: 14px 16px; }
      .hero { padding: 40px 16px 32px; }
      .hero-stats { gap: 24px; }
    }
    @media (max-width: 480px) {
      .match-row { grid-template-columns: 60px 1fr 28px 1fr; }
      .ko-row { grid-template-columns: 60px 1fr 28px 1fr; }
      .team-name-en { display: none; }
      .match-time { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Hero -->
  <div class="hero">
    <div class="hero-badge">⚽ FIFA World Cup 2026</div>
    <h1>完整賽程行事曆</h1>
    <p class="hero-sub">台灣時間 2026年6月12日 — 7月19日 · 共48隊 104場賽事</p>
    <div class="hero-stats">
      <div class="stat"><div class="stat-num">48</div><div class="stat-label">參賽國家</div></div>
      <div class="stat"><div class="stat-num">72</div><div class="stat-label">小組賽</div></div>
      <div class="stat"><div class="stat-num">32</div><div class="stat-label">淘汰賽</div></div>
      <div class="stat"><div class="stat-num">104</div><div class="stat-label">總場次</div></div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-section">
    <!-- Mobile toggle button (hidden on desktop) -->
    <button class="filter-toggle-btn" id="filterToggleBtn" onclick="toggleFilterPanel()">
      <span class="toggle-label">
        ⚽ 篩選賽程　<span class="active-tag" id="filterSummaryTag">32強</span>
      </span>
      <span class="toggle-arrow">▼</span>
    </button>

    <!-- Filter panel (always visible on desktop, collapsible on mobile) -->
    <div class="filter-desktop" id="filterPanel">
      <div class="filter-label" style="margin-top:8px;">按階段篩選</div>
      <div class="filter-row" id="stageFilterBar">
        <button class="filter-btn stage-btn" data-stage="all" onclick="filterStage('all')">全部賽程</button>
        <button class="filter-btn stage-btn" data-stage="group" onclick="filterStage('group')">🏟 小組賽</button>
        <button class="filter-btn stage-btn" data-stage="standings" onclick="filterStage('standings')">📊 積分表</button>
        <button class="filter-btn stage-btn active" data-stage="r32" onclick="filterStage('r32')">32強</button>
        <button class="filter-btn stage-btn" data-stage="r16" onclick="filterStage('r16')">16強</button>
        <button class="filter-btn stage-btn" data-stage="qf" onclick="filterStage('qf')">⚡ 8強</button>
        <button class="filter-btn stage-btn" data-stage="sf" onclick="filterStage('sf')">🔥 4強</button>
        <button class="filter-btn stage-btn" data-stage="final" onclick="filterStage('final')">🏆 決賽</button>
      </div>
      <div class="filter-label" style="margin-top:8px;">按小組篩選（小組賽）</div>
      <div class="filter-row" id="groupFilterBar">
        <button class="filter-btn active" data-filter="all" onclick="filterGroup('all')">全組</button>
        <button class="filter-btn group-A" data-filter="A" onclick="filterGroup('A')">A組</button>
        <button class="filter-btn group-B" data-filter="B" onclick="filterGroup('B')">B組</button>
        <button class="filter-btn group-C" data-filter="C" onclick="filterGroup('C')">C組</button>
        <button class="filter-btn group-D" data-filter="D" onclick="filterGroup('D')">D組</button>
        <button class="filter-btn group-E" data-filter="E" onclick="filterGroup('E')">E組</button>
        <button class="filter-btn group-F" data-filter="F" onclick="filterGroup('F')">F組</button>
        <button class="filter-btn group-G" data-filter="G" onclick="filterGroup('G')">G組</button>
        <button class="filter-btn group-H" data-filter="H" onclick="filterGroup('H')">H組</button>
        <button class="filter-btn group-I" data-filter="I" onclick="filterGroup('I')">I組</button>
        <button class="filter-btn group-J" data-filter="J" onclick="filterGroup('J')">J組</button>
        <button class="filter-btn group-K" data-filter="K" onclick="filterGroup('K')">K組</button>
        <button class="filter-btn group-L" data-filter="L" onclick="filterGroup('L')">L組</button>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-title">分組說明</div>

// 建立淘汰賽場次對照表，用於自動傳遞勝者/敗者到下一輪
const koMatchMap = {};
KNOCKOUT_DAYS.forEach(day => {
  day.matches.forEach(m => { koMatchMap[m.num] = m; });
});

// 解析淘汰賽某場比賽的勝者（遞迴）
function getKoWinner(matchNum) {
  const m = koMatchMap[matchNum];
  if (!m || !m.score) return null;
  let [mainScore, penPart] = m.score.split(' ');
  const [hS, aS] = mainScore.split('-').map(Number);
  let homeWins;
  if (hS !== aS) { homeWins = hS > aS; }
  else if (penPart) {
    const [hp, ap] = penPart.replace(/[()]/g, '').split('-').map(Number);
    homeWins = hp > ap;
  } else { return null; }
  return resolveTeam(homeWins ? m.home : m.away);
}

// 解析淘汰賽某場比賽的敗者（遞迴）
function getKoLoser(matchNum) {
  const m = koMatchMap[matchNum];
  if (!m || !m.score) return null;
  let [mainScore, penPart] = m.score.split(' ');
  const [hS, aS] = mainScore.split('-').map(Number);
  let homeWins;
  if (hS !== aS) { homeWins = hS > aS; }
  else if (penPart) {
    const [hp, ap] = penPart.replace(/[()]/g, '').split('-').map(Number);
    homeWins = hp > ap;
  } else { return null; }
  return resolveTeam(homeWins ? m.away : m.home);
}

// 解析一個隊伍欄位 → 回傳隊伍中文名，或 null
function resolveTeam(teamData) {
  if (!teamData) return null;
  if (teamData.team) return teamData.team;
  const winMatch = teamData.label.match(/^(M\d+) 勝者$/);
  if (winMatch) return getKoWinner(winMatch[1]);
  const loseMatch = teamData.label.match(/^(M\d+) 敗者$/);
  if (loseMatch) return getKoLoser(loseMatch[1]);
  return null;
}

function parseMMDD(mmdd) {
  const mo = parseInt(mmdd.slice(0,2)), d = parseInt(mmdd.slice(2,4));

  return { m: mo, d, dateObj: new Date(yr, mo-1, d) };
}

function calculateStandings() {
  const standings = {};
  Object.keys(GROUP_TEAMS).forEach(g => {
    standings[g] = GROUP_TEAMS[g].map(team => ({
      team, group: g, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0
    }));
  });

  GROUP_MATCHES.forEach(match => {
    const score = match[6];
    if (!score) return;
    const [hS, aS] = score.split('-').map(Number);
    const homeTeam = match[2];
    const awayTeam = match[3];
    const group = TEAM_GROUP[homeTeam];

    const hStat = standings[group].find(t => t.team === homeTeam);
    const aStat = standings[group].find(t => t.team === awayTeam);
    
    if(hStat && aStat) {
      hStat.p++; aStat.p++;
      hStat.gf += hS; hStat.ga += aS;
      aStat.gf += aS; aStat.ga += hS;
      if (hS > aS) { hStat.w++; hStat.pts += 3; aStat.l++; }
      else if (hS < aS) { aStat.w++; aStat.pts += 3; hStat.l++; }
      else { hStat.d++; aStat.d++; hStat.pts += 1; aStat.pts += 1; }
    }
  });

  Object.keys(standings).forEach(g => {
    standings[g].forEach(t => t.gd = t.gf - t.ga);
    standings[g].sort((a, b) => {
      if (b.pts !== a.pts) return b.pts - a.pts;
      if (b.gd !== a.gd) return b.gd - a.gd;
      if (b.gf !== a.gf) return b.gf - a.gf;
      return 0;
    });
  });
  return standings;
}

function renderAll() {
  calendar.innerHTML = '';

  renderStandings();
  
  const legend = document.querySelector('.legend');
  if (legend) legend.style.display = currentStageFilter === 'standings' ? 'none' : 'block';
  calendar.style.display = currentStageFilter === 'standings' ? 'none' : 'flex';

  if (currentStageFilter === 'standings') return;

  // Collect all day keys in order
  const allDayKeys = new Set([
    ...sortedGroupDays.map(([k])=>k),
    ...sortedKoDays,
  ]);
  const sortedAllDays = [...allDayKeys].sort();

  // Phase dividers already shown
  let lastPhase = null;

  sortedAllDays.forEach(key => {
    const mmdd = key.slice(5).replace('-','');
    const isGroupDay = !!groupDayMap[key];
    const isKoDay = !!koDayMap[key];

    // Apply stage filter
    const koData = koDayMap[key];
    if (currentStageFilter !== 'all') {
      if (currentStageFilter === 'group' && !isGroupDay) return;
      if (currentStageFilter !== 'group' && (!isKoDay || koData.stage !== currentStageFilter)) return;
    }

    // Apply group filter (only hides group-stage days, ko always shown)
    let groupMatches = [];
    if (isGroupDay && (currentStageFilter === 'all' || currentStageFilter === 'group')) {
      groupMatches = currentGroupFilter === 'all'
        ? groupDayMap[key].matches
        : groupDayMap[key].matches.filter(m => m.group === currentGroupFilter);
    }

    const showKo = isKoDay && (currentStageFilter === 'all' || currentStageFilter === koData?.stage);
    if (groupMatches.length === 0 && !showKo) return;

    // Phase divider
    let phase = isGroupDay && !showKo ? 'group' : (showKo ? koData.stage : 'group');
    if (showKo) phase = koData.stage;
    if (phase !== lastPhase) {
      const div = document.createElement('div');
      div.className = 'phase-divider';
      const phaseMap = {
        group:  { cls:'phase-group', label:'🏟 小組賽 Group Stage' },
        r32:    { cls:'phase-r32',   label:'⚔️ 32強 Round of 32' },
        r16:    { cls:'phase-r16',   label:'🎯 16強 Round of 16' },
        qf:     { cls:'phase-qf',    label:'⚡ 8強 Quarter-Finals' },
        sf:     { cls:'phase-sf',    label:'🔥 4強 Semi-Finals' },
        '3rd':  { cls:'phase-3rd',   label:'🥉 季軍賽 Third Place' },
        final:  { cls:'phase-final', label:'🏆 決賽 Final' },
      };
      const pm = phaseMap[phase] || { cls:'phase-group', label: phase };
      div.innerHTML = `<div class="phase-divider-line"></div><div class="phase-title ${pm.cls}">${pm.label}</div><div class="phase-divider-line"></div>`;
      calendar.appendChild(div);
      lastPhase = phase;
    }

    // Card
    const { m, d, dateObj } = parseMMDD(mmdd.replace('/','').padStart(4,'0').slice(-4).padStart(4,'0'));
    const { m: mo2, d: d2, dateObj: dObj } = parseMMDD(
      key.slice(5,7) + key.slice(8,10)
    );
    const wd = WEEKDAYS[dObj.getDay()];
    const isKo = showKo;
    const isFinal = showKo && koData.stage === 'final';
    const is3rd = showKo && koData.stage === '3rd';

    let cardClass = 'day-card';
    if (isFinal) cardClass += ' final-card';
    else if (is3rd) cardClass += ' third-card';
    else if (isKo) cardClass += ' knockout';

    const dateNumStr = key.slice(8,10);
    const dateMonStr = key.slice(5,7);

    // Pills
    let pillsHtml = '';
    if (groupMatches.length > 0) {
      const groups = [...new Set(groupMatches.map(m=>m.group))];
      pillsHtml = groups.map(g=>`<span class="group-pill group-${g}">${g}組</span>`).join('');
    }
    if (showKo) {
      pillsHtml += `<span class="group-pill ${koData.badgeClass}" style="border-radius:999px;padding:3px 10px;">${koData.label}</span>`;
    }

    const totalCount = groupMatches.length + (showKo ? koData.matches.length : 0);

    const card = document.createElement('div');
    card.className = cardClass;
    card.style.animationDelay = `${cardIdx * 0.05}s`;
    cardIdx++;

    const groupMatchesHtml = groupMatches.length > 0
      ? [...groupMatches].sort((a,b)=>a.time<b.time?-1:1).map(renderGroupMatch).join('')
      : '';

    const koMatchesHtml = showKo
      ? koData.matches.map(m=>renderKoMatch(m, koData.badgeClass)).join('')
      : '';

    card.innerHTML = `
      <div class="day-header">
        <div class="day-date-block">
          <div class="day-num">${parseInt(dateNumStr)}</div>
          <div class="day-mon">${parseInt(dateMonStr)}月</div>
        </div>
        <div class="day-info">
          <div class="day-weekday">星期${wd}　<span style="color:var(--text-secondary);font-weight:400;font-size:0.85rem;">2026.${dateMonStr}.${dateNumStr}</span></div>
          <div class="day-match-count">${totalCount} 場比賽</div>
        </div>
        <div class="day-groups">${pillsHtml}</div>
      </div>
      <div class="matches">${groupMatchesHtml}${koMatchesHtml}</div>
    `;
    calendar.appendChild(card);
  });

  // Twemoji: 重新轉換動態新增的 DOM emoji
  if (typeof twemoji !== 'undefined') {
    twemoji.parse(calendar, { folder: 'svg', ext: '.svg', base: 'https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/' });
    twemoji.parse(legendGrid, { folder: 'svg', ext: '.svg', base: 'https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/' });
  }
}

function filterGroup(g) {
  currentGroupFilter = g;
  document.querySelectorAll('#groupFilterBar .filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === g));
  if (g !== 'all' && currentStageFilter !== 'all' && currentStageFilter !== 'group') {
    currentStageFilter = 'all';
    document.querySelectorAll('#stageFilterBar .filter-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.stage === 'all'));
  }
  updateFilterSummary();
  closeFilterPanel();
  renderAll();
}

function filterStage(s) {
  currentStageFilter = s;
  document.querySelectorAll('#stageFilterBar .filter-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.stage === s));
  if (s !== 'all' && s !== 'group' && s !== 'standings') {
    currentGroupFilter = 'all';
    document.querySelectorAll('#groupFilterBar .filter-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.filter === 'all'));
  }
  updateFilterSummary();
  closeFilterPanel();
  renderAll();
}

// ─── Mobile Filter Panel ──────────────────────────────────────────────────────
const STAGE_LABELS = {
  all:'全部賽程', group:'🏟 小組賽', standings:'📊 積分表', r32:'32強', r16:'16強',
  qf:'⚡ 8強', sf:'🔥 4強', '3rd':'🥉 季軍', final:'🏆 決賽'
};

function updateFilterSummary() {
  const tag = document.getElementById('filterSummaryTag');
  if (!tag) return;
  let label = STAGE_LABELS[currentStageFilter] || currentStageFilter;
  if (currentStageFilter === 'all' && currentGroupFilter !== 'all') label = currentGroupFilter + '組';
  if (currentStageFilter === 'group' && currentGroupFilter !== 'all') label = '🏟 ' + currentGroupFilter + '組';
  tag.textContent = label;
  // gold for group filter, purple for stage
  tag.className = 'active-tag' + (currentStageFilter === 'all' && currentGroupFilter === 'all' ? ' gold' : '');
}

function toggleFilterPanel() {
  const panel = document.getElementById('filterPanel');
  const btn = document.getElementById('filterToggleBtn');
  panel.classList.toggle('open');
  btn.classList.toggle('open');
}

function closeFilterPanel() {
  const panel = document.getElementById('filterPanel');
  const btn = document.getElementById('filterToggleBtn');
  panel.classList.remove('open');
  btn.classList.remove('open');
}

updateFilterSummary();
renderAll();
</script>

<script>
  // 定義全局 twemoji 轉換僕道（不包含 filter 區域）
  function applyTwemoji(el) {
    if (!el || typeof twemoji === 'undefined') return;
    twemoji.parse(el, { folder: 'svg', ext: '.svg', base: 'https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/' });
  }
  // 初始化：轉換 filter 區、hero 等靜態內容
  applyTwemoji(document.querySelector('.filter-section'));
  applyTwemoji(document.querySelector('.hero'));
  // renderAll 已內建 twemoji.parse(calendar)，不需要再次處理
</script>
</body>
</html>
