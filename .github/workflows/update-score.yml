name: ⚽ 更新比分

on:
  workflow_dispatch:
    inputs:
      scores:
        description: '比分更新（格式：M1 2-1）多場用分號隔開（M1 2-1; M2 0-0）PK 戰用括號（M73 1-1 (4-3)）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update scores in index.html
        env:
          SCORES: ${{ github.event.inputs.scores }}
        run: node scripts/update-scores.js "$SCORES"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "⚽ 更新比分：${{ github.event.inputs.scores }}"
            git push
          fi
